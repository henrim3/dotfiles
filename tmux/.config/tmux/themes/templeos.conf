# General status bar
set -g status-style "bg=#ffffff,fg=#000000"

# Status bar position
set -g status-position bottom

# Left side
set -g status-left-length 40
set -g status-left "#[bg=#0000aa,fg=#ffffff,bold] #S #[bg=#ffffff,fg=#000000] "

# Right side
set -g status-right-length 80
set -g status-right "#[fg=#555555]%Y-%m-%d #[fg=#0000aa]%H:%M "

# Window styles
set -g window-status-format "#[bg=#aaaaaa,fg=#000000] #I:#W "
set -g window-status-current-format "#[bg=#0000aa,fg=#ffffff,bold] #I:#W "

# Activity / alerts
set -g window-status-activity-style "fg=#aa00aa,bg=#ffffff"
set -g window-status-bell-style "fg=#f44747,bg=#ffffff"

# Pane borders
set -g pane-border-style "fg=#aaaaaa"
set -g pane-active-border-style "fg=#0000aa"

# Messages
set -g message-style "bg=#0000aa,fg=#ffffff"

# Command prompt
set -g mode-style "bg=#0000aa,fg=#ffffff"

# Copy mode selection
set -g copy-mode-match-style "fg=#ffffff,bg=#aa00aa"
set -g copy-mode-current-match-style "fg=#ffffff,bg=#0000aa"

# Clock mode
set -g clock-mode-colour "#0000aa"
set -g clock-mode-style 24

# Remove default tmux visual noise
set -g status-justify left
set -g status-interval 5

# Square/blocky separators
set -g status-left "#[bg=#0000aa,fg=#ffffff] [#S] #[default]"
set -g status-right "#[bg=#aaaaaa,fg=#000000] %H:%M "
